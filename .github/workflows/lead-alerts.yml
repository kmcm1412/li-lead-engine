name: Lead alerts

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: lead-alerts

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mail dependency
        run: npm install nodemailer --no-save --no-audit --no-fund
      - name: Check inbox and send alerts
        run: node scripts/alerts.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          INBOX_CODE: ${{ vars.INBOX_CODE }}
      - name: Save alert state
        run: |
          git config user.name "lead-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/notified.json
          git diff --cached --quiet || (git commit -m "Alert state" && git pull --rebase && git push)
