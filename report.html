<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LeadEngine LI — Performance Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4 92 20v28c0 26-18 43-42 48C26 91 8 74 8 48V20Z' fill='%230033A0'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0033A0;--blue-dark:#00256e;--ink:#16203a;--muted:#5b6478;--line:#e3e7f0;--green:#0c7a3e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:60px}
  .hero{background:linear-gradient(135deg,#001a4d,#00256e 55%,#0033A0);color:#fff;padding:24px 18px}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  .hero h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .hero p{font-size:13px;opacity:.85;margin-top:2px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;flex:1;min-width:140px;text-align:center;box-shadow:0 1px 2px rgba(22,32,58,.06)}
  .card .n{font-size:24px;font-weight:800;color:var(--blue)}
  .card .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(22,32,58,.06)}
  h2{font-size:16px;color:var(--blue-dark);margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px}
  td{padding:8px;border-top:1px solid #eef1f7}
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:20px}
  .err{background:#fdeded;border:1px solid #f3c6c6;color:#7f1d1d;border-radius:10px;padding:16px;margin-top:24px;text-align:center}
  @media print{.hero{-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <h1>📈 LeadEngine LI — Performance Report</h1>
  <p>The Troiano Agency (Allstate) · aggregate totals only — no client information · <span id="upd"></span></p>
</div></div>
<div class="wrap" id="out"><div class="err" style="display:none" id="err">Couldn’t load the report — check the link, or ask the app owner to turn on “Performance report” in ✉️ Scripts &amp; Letters.</div></div>
<script>
"use strict";
const CFG={apiKey:"AIzaSyBQpiWpPM-sim2Up5RG7NroKfrtePL43i0",projectId:"li-lead-engine"};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en-US');
(async()=>{
  const code=new URLSearchParams(location.search).get('c')||'';
  const out=document.getElementById('out');
  try{
    if(!code)throw new Error('no code');
    const r=await fetch('https://firestore.googleapis.com/v1/projects/'+CFG.projectId+'/databases/(default)/documents/pipelines/report-'+encodeURIComponent(code)+'?key='+CFG.apiKey);
    if(!r.ok)throw new Error('http '+r.status);
    const doc=await r.json();
    const d=JSON.parse(doc.fields.data.stringValue);
    document.getElementById('upd').textContent='updated '+new Date(d.updated).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    const t=d.totals,rate=(+d.commRate||10)/100;
    const card=(n,l)=>'<div class="card"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
    let html='<div class="cards">'+
      card(fmt(t.leads),'Leads worked')+card(fmt(t.quoteRequests||0),'Inbound quote requests')+
      card(fmt(t.won),'Policies won')+card('$'+fmt(t.premium),'Premium written')+
      card('$'+fmt(Math.round(t.premium*rate)),'Est. commission ('+(d.commRate||10)+'%)')+
      card(fmt(t.touches),'Sales touches logged')+card(fmt(t.xdates),'Renewal x-dates banked')+
      '</div>';
    const months=Object.entries(d.months||{}).sort((a,b)=>b[0].localeCompare(a[0]));
    if(months.length){
      html+='<div class="panel"><h2>Month by month</h2><table><tr><th>Month</th><th>New leads</th><th>Won</th><th>Premium</th></tr>'+
        months.map(([m,v])=>'<tr><td><b>'+esc(m)+'</b></td><td>'+fmt(v.added)+'</td><td>'+fmt(v.won)+'</td><td>$'+fmt(v.prem)+'</td></tr>').join('')+'</table></div>';
    }
    const srcs=Object.entries(d.srcs||{}).sort((a,b)=>b[1].n-a[1].n);
    if(srcs.length){
      html+='<div class="panel"><h2>By lead source</h2><table><tr><th>Source</th><th>Leads</th><th>Won</th><th>Premium</th></tr>'+
        srcs.map(([k,v])=>'<tr><td><b>'+esc(k)+'</b></td><td>'+fmt(v.n)+'</td><td>'+fmt(v.won)+'</td><td>$'+fmt(v.prem)+'</td></tr>').join('')+'</table></div>';
    }
    html+='<div class="foot">Generated automatically by LeadEngine LI · numbers update live as the pipeline is worked · x-dates represent future renewal opportunities banked by the tool</div>';
    out.innerHTML=html;
  }catch(e){document.getElementById('err').style.display='block'}
})();
</script>
</body>
</html>
