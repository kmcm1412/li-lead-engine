name: Daily lead digest

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 7:00 AM Eastern (EDT), weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mail dependency
        run: npm install nodemailer --no-save --no-audit --no-fund
      - name: Build digest (and email if configured)
        run: node scripts/digest.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
      - name: Publish digest page
        run: |
          git config user.name "lead-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digest.html data/seen.json
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%F)"
          git push
